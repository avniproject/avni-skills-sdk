# fk-matrix.yaml — canonical foreign-key matrix for AVNI bundles
#
# SINGLE SOURCE OF TRUTH for the bundle dependency graph's FK rules.
# Previously these rules lived as the hardcoded `FORM_TYPE_MAPPING_REQUIREMENTS`
# table plus inline `addEdge(...)` calls in spec/graph.js. This file extracts
# that knowledge so the graph builder, validators, and docs can all read one
# authoritative description.
#
# Extracted verbatim (lossless) from, and kept in parity with:
#   • spec/graph.js                     — FORM_TYPE_MAPPING_REQUIREMENTS + edges
#   • validators/bundle_validator.js    — FORM_MAPPING_RULES (server mirror; NOT modified)
#   • avni-server JPA models            — strictest spec (the Jackson deserializer)
#
# A parity test (fk-matrix.test.cjs) asserts that the table derived from
# `formTypes` below DEEP-EQUALS the original hardcoded
# FORM_TYPE_MAPPING_REQUIREMENTS, proving the extraction lost nothing.
#
# severity legend (for the `presence` field on edges):
#   required  → graph.js emits this edge with required: true  (DANGLING_REF ⇒ error)
#   optional  → graph.js emits this edge with required: false (DANGLING_REF ⇒ warning)
#   conditional → required-ness depends on the carrying formType (see formTypes below)

version: 1

# ─────────────────────────────────────────────────────────────────────
# formTypes — which FK fields the formMapping carrying that form REQUIRES.
# This is the canonical encoding of FORM_TYPE_MAPPING_REQUIREMENTS
# (spec/graph.js:22-30), itself a verbatim mirror of FORM_MAPPING_RULES
# (validators/bundle_validator.js:65-73).
#
# `programUUID` / `encounterTypeUUID`: true ⇒ REQUIRED on that mapping.
# ─────────────────────────────────────────────────────────────────────
formTypes:
  IndividualProfile:
    programUUID: false
    encounterTypeUUID: false
  ProgramEnrolment:
    programUUID: true
    encounterTypeUUID: false
  ProgramExit:
    programUUID: true
    encounterTypeUUID: false
  ProgramEncounter:
    programUUID: true
    encounterTypeUUID: true
  ProgramEncounterCancellation:
    programUUID: true
    encounterTypeUUID: true
  Encounter:
    programUUID: false
    encounterTypeUUID: true
  IndividualEncounterCancellation:
    programUUID: false
    encounterTypeUUID: true

# ─────────────────────────────────────────────────────────────────────
# nodeKinds — every entity kind the graph builder nodes by uuid.
# Mirrors the addNode(...) kinds in spec/graph.js. Listed here so the
# matrix is a complete description of the graph's vocabulary AND so the
# graph builder can create nodes by walking this list (single source).
#
# `source` is the bundle file the kind is loaded from (null = composed
# inside another entity, never noded independently).
#
# `noded: true`  → graph.js calls addNode(kind, record) for each record in
#                  `source` (in the order this list declares).
# `noded: false` → declared for completeness but NOT yet noded by graph.js
#                  (group / groupPrivilege / taskType — #14 follow-up).
# `wrappedKey`   → for the operational mirrors, the key the deterministic
#                  generator wraps the array under ({ operationalX: [...] });
#                  the loader tolerates both wrapped and bare-array shapes.
#
# IMPORTANT: the ORDER of `noded: true` kinds below is load-bearing — graph.js
# adds nodes in exactly this order, so byKind / counts / query ordering is
# preserved. The pre-#14 graph.js used this same order. (Verified identical by
# spec/graph-parity.test.cjs against the frozen graph-golden.cjs.)
# ─────────────────────────────────────────────────────────────────────
nodeKinds:
  - kind: concept
    source: concepts.json
    noded: true
  - kind: subjectType
    source: subjectTypes.json
    noded: true
  - kind: program
    source: programs.json
    noded: true
  - kind: encounterType
    source: encounterTypes.json
    noded: true
  - kind: form
    source: forms/*.json
    noded: true
  - kind: formMapping
    source: formMappings.json
    noded: true
  - kind: operationalSubjectType
    source: operationalSubjectTypes.json
    wrappedKey: operationalSubjectTypes
    noded: true
  - kind: operationalProgram
    source: operationalPrograms.json
    wrappedKey: operationalPrograms
    noded: true
  - kind: operationalEncounterType
    source: operationalEncounterTypes.json
    wrappedKey: operationalEncounterTypes
    noded: true
  - kind: addressLevelType
    source: addressLevelTypes.json
    noded: true
  - kind: groupRole
    source: groupRoles.json
    noded: true
  # ── Currently-missing node kinds (no addNode in graph.js yet).
  #    Declared here so the matrix anticipates the edges below.
  #    RESOLVED (#14): group/groupPrivilege ARE validated by bundle_validator.js
  #    (G1-G2) — the groupUUID FK is a hard ERROR (G1), encoded as required below.
  #    They are not yet noded by graph.js; wiring them in is a #14 follow-up.
  - kind: group
    source: groups.json
    noded: false
  - kind: groupPrivilege
    source: groupPrivilege.json
    noded: false
  - kind: taskType
    source: taskTypes.json
    noded: false

# ─────────────────────────────────────────────────────────────────────
# edges — every typed cross-reference the graph builder emits.
#
# As of #14 this block is the SINGLE SOURCE OF TRUTH for graph edges:
# spec/graph.js is now a generic interpreter that walks the bundle and emits
# one edge per rule below (it no longer carries hardcoded addEdge(...) calls).
# spec/graph-parity.test.cjs proves the YAML-driven output is IDENTICAL to the
# frozen pre-#14 builder (spec/graph-golden.cjs).
#
# `presence` encodes the `required` flag graph.js stamps on each edge:
#   required    → required: true       (DANGLING_REF / MISSING_REQUIRED_REF ⇒ error)
#   optional    → required: false      (DANGLING_REF ⇒ warning)
#   conditional → required: !!FORM_TYPE_MAPPING_REQUIREMENTS[formType][conditionalOn]
#
# The `emit:` sub-block tells the interpreter HOW to produce the edge. It is a
# faithful, declarative transcription of the original addEdge(...) call — no new
# server behaviour is invented. Fields:
#   source        bundle collection to iterate (a nodeKinds `source`); each record
#                 is one potential edge origin. `via` reuses an already-loaded kind.
#   fromPath      dotted path on the record → edge `from` uuid   (default: "uuid")
#   walk          ordered list of nested array names to descend into; the edge is
#                 emitted PER leaf element (per-element edge). Omitted ⇒ per-record.
#   toPath        dotted path → edge `to` uuid, evaluated on the leaf element when
#                 `walk` is present, else on the record. May be a LIST of paths
#                 tried in order (first non-empty wins) — used by operationalMirror
#                 to tolerate nested `X.uuid` vs flat `XUUID` shapes.
#   guard         path that must be truthy for the edge to emit (default: same as
#                 the resolved toPath — mirrors the original `if (ref)` guards).
#   fieldTemplate when the edge's `field` label is interpolated per element, the
#                 template with `{prop}` placeholders resolved against the leaf
#                 element (formElementConcept embeds the element's `name`).
#   stampFormType true ⇒ stamp the carrying record's formType onto the edge (the
#                 formMapping edges carry formType; nothing else does).
#
# Edges with NO `emit:` block are declared for completeness but NOT emitted by
# graph.js yet (group / groupPrivilege — their kinds are `noded: false`). Wiring
# them in is a #14 follow-up; the matrix already declares their canonical server
# severity so the rule is ready the moment those kinds are noded.
# ─────────────────────────────────────────────────────────────────────
edges:
  # ── ConceptAnswer (coded answer → standalone concept)
  - edgeKind: conceptAnswer
    from: concept
    to: concept
    field: concept.answers[].uuid
    presence: required          # graph.js addEdge default (required !== false)
    emit:
      source: concepts.json
      fromPath: uuid
      walk: [answers]
      toPath: uuid              # guard: only emit when the answer has a uuid

  # ── EncounterType display concept (JPA-only edge, optional in JSON shape)
  - edgeKind: displayConcept
    from: encounterType
    to: concept
    field: encounterType.conceptUuid
    presence: optional
    emit:
      via: encounterType        # reuse the already-noded encounterTypes
      toPath: conceptUuid

  # ── Form element → concept
  - edgeKind: formElementConcept
    from: form
    to: concept
    field: form.formElementGroups[].formElements[].concept.uuid
    presence: required          # graph.js addEdge default
    emit:
      via: form                 # reuse the already-noded forms
      walk: [formElementGroups, formElements]
      toPath: concept.uuid
      # The original interpolated the element's name into the field label.
      fieldTemplate: 'form.formElementGroups[].formElements["{name}"].concept.uuid'

  # ── Form decision concepts (JPA M:M)
  - edgeKind: decisionConcept
    from: form
    to: concept
    field: form.decisionConcepts[].uuid
    presence: optional
    emit:
      via: form
      walk: [decisionConcepts]
      toPath: uuid

  # ── FormMapping central join edges
  - edgeKind: mappingForm
    from: formMapping
    to: form
    field: formMapping.formUUID
    presence: required
    emit:
      via: formMapping
      toPath: formUUID
      stampFormType: true
  - edgeKind: mappingSubjectType
    from: formMapping
    to: subjectType
    field: formMapping.subjectTypeUUID
    presence: required
    emit:
      via: formMapping
      toPath: subjectTypeUUID
      stampFormType: true
  - edgeKind: mappingProgram
    from: formMapping
    to: program
    field: formMapping.programUUID
    presence: conditional       # required iff formTypes[formType].programUUID
    conditionalOn: programUUID
    emit:
      via: formMapping
      toPath: programUUID
      stampFormType: true
  - edgeKind: mappingEncounterType
    from: formMapping
    to: encounterType
    field: formMapping.encounterTypeUUID
    presence: conditional       # required iff formTypes[formType].encounterTypeUUID
    conditionalOn: encounterTypeUUID
    emit:
      via: formMapping
      toPath: encounterTypeUUID
      stampFormType: true
  - edgeKind: mappingTaskType
    from: formMapping
    to: taskType
    field: formMapping.taskTypeUUID
    presence: optional          # graph.js emits required: false
    # [To be Analysed] confirm severity vs server — server may treat the
    # taskType FK as required for Task-form mappings; graph.js currently
    # only emits it as optional.
    emit:
      via: formMapping
      toPath: taskTypeUUID
      stampFormType: true

  # ── Operational mirrors (each operational entity → its metadata entity).
  #    refUuid = record.<nested>.uuid || record.<flat>UUID — both shapes
  #    tolerated, hence the toPath fallback list.
  - edgeKind: operationalMirror
    from: operationalSubjectType
    to: subjectType
    field: operationalSubjectType.subjectType.uuid
    presence: required
    emit:
      via: operationalSubjectType
      toPath: [subjectType.uuid, subjectTypeUUID]
  - edgeKind: operationalMirror
    from: operationalProgram
    to: program
    field: operationalProgram.program.uuid
    presence: required
    emit:
      via: operationalProgram
      toPath: [program.uuid, programUUID]
  - edgeKind: operationalMirror
    from: operationalEncounterType
    to: encounterType
    field: operationalEncounterType.encounterType.uuid
    presence: required
    emit:
      via: operationalEncounterType
      toPath: [encounterType.uuid, encounterTypeUUID]

  # ── AddressLevelType self-referential hierarchy
  - edgeKind: hierarchy
    from: addressLevelType
    to: addressLevelType
    field: addressLevelType.parentUuid
    presence: optional
    emit:
      via: addressLevelType
      toPath: parentUuid

  # ── GroupRole (two FKs, both to SubjectType)
  - edgeKind: groupRole
    from: groupRole
    to: subjectType
    field: groupRole.groupSubjectTypeUUID
    presence: required
    emit:
      via: groupRole
      toPath: groupSubjectTypeUUID
  - edgeKind: groupRole
    from: groupRole
    to: subjectType
    field: groupRole.memberSubjectTypeUUID
    presence: required
    emit:
      via: groupRole
      toPath: memberSubjectTypeUUID

  # ── Currently-missing edges: graph.js does NOT yet node groups /
  #    groupPrivilege, so these are not emitted today (NO `emit:` block).
  #    Encoded here with their canonical server severity so the matrix
  #    anticipates them; wiring them into the graph builder is deferred
  #    (see TODO(#14 follow-up) in graph.js).
  - edgeKind: groupPrivilegeGroup
    from: groupPrivilege
    to: group
    field: groupPrivilege.groupUUID
    presence: required
    # RESOLVED (#14): bundle_validator.js G1 (bundle_validator.js:566-568) pushes
    # a hard ERROR when groupUUID is absent from groups.json, so the canonical
    # server severity is "required" — a dangling groupUUID is an error, not a
    # warning. NOTE: graph.js does not yet EMIT this edge (groupPrivilege is not
    # noded), so wiring it into the graph builder so this severity is actually
    # enforced is a #14 follow-up; the matrix correctly declares the server
    # severity in the meantime.
  - edgeKind: groupPrivilegeSubjectType
    from: groupPrivilege
    to: subjectType
    field: groupPrivilege.subjectTypeUUID
    presence: optional
    # RESOLVED (#14): bundle_validator.js:576-577 pushes a WARNING (not an error)
    # for a dangling subjectType ref, so "optional" is the correct canonical
    # severity. (Not yet emitted by graph.js — same #14 follow-up as above.)
  - edgeKind: groupPrivilegeProgram
    from: groupPrivilege
    to: program
    field: groupPrivilege.programUUID
    presence: optional
    # RESOLVED (#14): bundle_validator.js:581-582 pushes a WARNING (not an error)
    # for a dangling program ref, so "optional" is the correct canonical
    # severity. (Not yet emitted by graph.js — same #14 follow-up as above.)
